<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Caracteres</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <label for="texto">Ingrese su mensaje:</label>
    <textarea id="texto" placeholder="Escriba aquí..."></textarea>
    
    <!-- Contador en tiempo real -->
    <div class="contador">
      Caracteres: <span id="numCaracteres">0</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
