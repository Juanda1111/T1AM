<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escena Interactiva - Animación y Sonido</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="paisaje">
    <img id="sol" class="objeto interactivo" src="https://icons.iconarchive.com/icons/dapino/beach/128/sun-icon.png" alt="Sol" title="¡Haz clic en el sol!">
    <img id="nube" class="objeto interactivo" src="https://icons.iconarchive.com/icons/flaticonmaker/flat-style/128/cloud-icon.png" alt="Nube" title="¡Haz clic en la nube!">
    <img id="nevado" class="objeto" src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png" alt="Nevado 1">
    <img id="nevado2" class="objeto" src="https://icons.iconarchive.com/icons/google/noto-emoji-travel-places/512/42462-mountain-icon.png" alt="Nevado 2">
    <img id="arbol" class="objeto interactivo" src="https://icons.iconarchive.com/icons/google/noto-emoji-animals-nature/128/22330-deciduous-tree-icon.png" alt="Árbol" title="¡Haz clic en el árbol!">
    <img id="bici" class="objeto interactivo" src="https://icons.iconarchive.com/icons/aha-soft/transport/128/bike-icon.png" alt="Bicicleta" title="¡Haz clic en la bici para avanzar!">
  </div>

  <p class="instrucciones">Haz clic en cualquier elemento (Bici, Sol, Nube o Árbol) para interactuar.</p>

  <script src="script.js"></script>
</body>
</html>
