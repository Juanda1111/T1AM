<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Scroll Horizontal + Vertical</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Menu deslizable horizontalmente -->
  <nav class="scroll-menu">
    <button data-target="seccion1">Seccion 1</button>
    <button data-target="seccion2">Seccion 2</button>
    <button data-target="seccion3">Seccion 3</button>
    <button data-target="seccion4">Seccion 4</button>
    <button data-target="seccion5">Seccion 5</button>
  </nav>

  <!-- Subsecciones -->
  <main>
    <section id="seccion1"><h2>Contenido Seccion 1</h2></section>
    <section id="seccion2"><h2>Contenido Seccion 2</h2></section>
    <section id="seccion3"><h2>Contenido Seccion 3</h2></section>
    <section id="seccion4"><h2>Contenido Seccion 4</h2></section>
    <section id="seccion5"><h2>Contenido Seccion 5</h2></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
